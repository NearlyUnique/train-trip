{{define "journey.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train Trip · Journey</title>
  <link rel="stylesheet" href="{{basePath}}/static/uchu.css">
  <link rel="stylesheet" href="{{basePath}}/static/style.css">
  <script src="{{basePath}}/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="{{basePath}}/" class="site-title">Train Trip</a>
    <span class="site-time">{{nowTime}}</span>
  </header>
  <main class="journey-view">
    {{range .Legs}}
    {{template "leg.html" .}}
    <div id="interchange-deps-{{.N}}"></div>
    {{end}}
  </main>
</body>
</html>
{{end}}
