{{define "content"}}
<section class="search-section">
  <h1>Where are you going?</h1>
  <form class="search-form" id="search-form"
        hx-get="{{basePath}}/departures"
        hx-target="#results"
        hx-swap="innerHTML"
        hx-push-url="false">

    <label for="origin-input">From</label>
    <div class="ac-wrap">
      <input id="origin-input" class="ac-input" type="text"
             role="combobox"
             placeholder="e.g. Sheffield or SHF"
             autocomplete="off"
             aria-autocomplete="list"
             aria-controls="ac-list"
             aria-expanded="false"
             aria-haspopup="listbox">
      <input id="origin" name="origin" type="hidden">
      <ul class="ac-list" id="ac-list" hidden></ul>
    </div>

    <label for="date">Date</label>
    <input id="date" name="date" type="date"
           placeholder="today">

    <label for="time">Time</label>
    <input id="time" name="time" type="time"
           placeholder="now">

    <button type="submit">Find trains</button>
  </form>

  <div id="results"></div>
</section>

<script>
(function () {
  const STATIONS = {{stationsJSON .Stations}};

  const searchInput = document.getElementById('origin-input');
  const hiddenInput = document.getElementById('origin');
  const list        = document.getElementById('ac-list');
  const form        = document.getElementById('search-form');

  let activeIdx = -1;

  function wordBoundaryMatch(name, q) {
    // True if any whitespace/punctuation-delimited word in name starts with q.
    return name.toLowerCase().split(/[\s&()/,-]+/).some(w => w.startsWith(q));
  }

  function search(raw) {
    const q = raw.trim().toLowerCase();
    if (!q) { close(); return; }

    const crsHits  = [];
    const nameHits = [];
    for (const s of STATIONS) {
      if (s.crs.toLowerCase().startsWith(q)) {
        crsHits.push(s);
      } else if (wordBoundaryMatch(s.name, q)) {
        nameHits.push(s);
      }
    }

    const results = [...crsHits, ...nameHits].slice(0, 10);
    if (!results.length) { close(); return; }

    activeIdx = -1;
    list.innerHTML = '';
    for (const s of results) {
      const li = document.createElement('li');
      li.dataset.crs  = s.crs;
      li.dataset.name = s.name;
      const code = document.createElement('span');
      code.className   = 'ac-code';
      code.textContent = s.crs;
      li.appendChild(code);
      li.appendChild(document.createTextNode(' ' + s.name));
      li.addEventListener('mousedown', e => { e.preventDefault(); select(s); });
      list.appendChild(li);
    }
    list.hidden = false;
    searchInput.setAttribute('aria-expanded', 'true');
  }

  function select(s) {
    searchInput.value = s.name;
    hiddenInput.value = s.crs;
    searchInput.setCustomValidity('');
    close();
  }

  function close() {
    list.hidden = true;
    activeIdx   = -1;
    searchInput.setAttribute('aria-expanded', 'false');
  }

  function setActive(items, idx) {
    items.forEach((li, i) => li.classList.toggle('ac-active', i === idx));
    if (idx >= 0) {
      searchInput.setAttribute('aria-activedescendant', items[idx].id || '');
    }
  }

  searchInput.addEventListener('input', () => {
    hiddenInput.value = '';
    search(searchInput.value);
  });

  searchInput.addEventListener('keydown', e => {
    const items = [...list.querySelectorAll('li')];
    if (!items.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, items.length - 1);
      setActive(items, activeIdx);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      setActive(items, activeIdx);
    } else if (e.key === 'Enter' && activeIdx >= 0) {
      e.preventDefault();
      const li = items[activeIdx];
      select({ crs: li.dataset.crs, name: li.dataset.name });
    } else if (e.key === 'Escape') {
      close();
    }
  });

  searchInput.addEventListener('blur', () => setTimeout(close, 150));

  form.addEventListener('submit', e => {
    if (!hiddenInput.value) {
      e.preventDefault();
      searchInput.setCustomValidity('Select a station from the list');
      searchInput.reportValidity();
    }
  });
})();
</script>
{{end}}
