{{define "content"}}
<section class="search-section">
  <h1>Where are you going?</h1>
  <form class="search-form" id="search-form"
        hx-get="{{basePath}}/departures"
        hx-target="#results"
        hx-swap="innerHTML"
        hx-push-url="true">

    <label for="origin-input">From</label>
    <div class="ac-wrap">
      <input id="origin-input" class="ac-input" type="text"
             role="combobox"
             placeholder="e.g. Sheffield or SHF"
             autocomplete="off"
             aria-autocomplete="list"
             aria-controls="ac-list"
             aria-expanded="false"
             aria-haspopup="listbox">
      <input id="origin" name="origin" type="hidden">
      <ul class="ac-list" id="ac-list" hidden></ul>
    </div>

    <label for="dest-input">To <span class="label-optional">(optional)</span></label>
    <div class="ac-wrap">
      <input id="dest-input" class="ac-input" type="text"
             role="combobox"
             placeholder="e.g. Manchester or MAN"
             autocomplete="off"
             aria-autocomplete="list"
             aria-controls="dest-ac-list"
             aria-expanded="false"
             aria-haspopup="listbox">
      <input id="dest" name="to" type="hidden">
      <ul class="ac-list" id="dest-ac-list" hidden></ul>
    </div>

    <label for="date">Date</label>
    <input id="date" name="date" type="date"
           placeholder="today">

    <label for="time">Time</label>
    <input id="time" name="time" type="time"
           placeholder="now">

    <button type="submit">Find trains</button>
  </form>

  <div id="results"></div>
</section>

<script src="{{basePath}}/static/autocomplete.js"></script>
<script>
  initAutocomplete({{stationsJSON .Stations}});
  initAutocomplete({{stationsJSON .Stations}}, 'dest-input', 'dest', 'dest-ac-list', 'search-form', false);
</script>
<script>
  (function () {
    var STALE_MS = 5 * 60 * 1000;
    var lastLoad = null;
    document.body.addEventListener('htmx:afterSwap', function (e) {
      if (e.detail.target && e.detail.target.id === 'results') {
        lastLoad = Date.now();
      }
    });
    function maybeRefresh() {
      if (lastLoad !== null && Date.now() - lastLoad > STALE_MS) {
        var form = document.getElementById('search-form');
        if (form) { htmx.trigger(form, 'submit'); }
      }
    }
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { maybeRefresh(); }
    });
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) { maybeRefresh(); }
    });
  })();
</script>
{{end}}
