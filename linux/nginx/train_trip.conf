# Train Trip - serves /train and /trains (with or without trailing slash)
# include this inside the main site's server block (e.g. /etc/nginx/sites-enabled/clippy.conf):
#   include /etc/nginx/snippets/trains.conf;

# /train and /trains -> add the trailing slash so relative asset URLs resolve
location ~ ^/(trains?)$ {
    return 301 /$1/$is_args$args;
}

# /train/... and /trains/... -> strip the prefix and proxy to the app
location ~ ^/trains?(/.*)?$ {
    proxy_pass http://127.0.0.1:8083$1$is_args$args;
}
